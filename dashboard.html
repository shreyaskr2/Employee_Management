<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f7fb;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .container {
      display: flex;
      gap: 20px;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      flex: 1;
      padding: 20px;
    }
    .card h2 {
      margin-top: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    table th,
    table td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    table th {
      background-color: #ecf0f1;
    }
    .stats {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }
    .stat-box {
      background-color: #3498db;
      color: white;
      border-radius: 8px;
      padding: 20px;
    }
    .stat-box:nth-child(2) {
      background-color: #1abc9c;
    }
    .stat-box:nth-child(3) {
      background-color: #9b59b6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Employee Management Dashboard</h1>
    <p>Overview of employee status and recent activity</p>
  </header>

  <div class="container">
    <section class="card">
      <h2>Quick Stats</h2>
      <div class="stats">
        <div class="stat-box">
          <h3>Total Employees</h3>
          <p>124</p>
        </div>
        <div class="stat-box">
          <h3>On Leave</h3>
          <p>8</p>
        </div>
        <div class="stat-box">
          <h3>Open Positions</h3>
          <p>5</p>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Recent Hires</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Department</th>
            <th>Start Date</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Emma Johnson</td>
            <td>Marketing</td>
            <td>2026-07-01</td>
          </tr>
          <tr>
            <td>Michael Chen</td>
            <td>Finance</td>
            <td>2026-06-15</td>
          </tr>
          <tr>
            <td>Aisha Patel</td>
            <td>Engineering</td>
            <td>2026-05-28</td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>
</body>
</html>
